[package]
name = "java-compat-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "Unofficial port of the behaviour of the JDK (java.text, java.util, java.util.regex, charsets) as OpenJDK 21 and 26 record it"
repository = "https://github.com/oxidestack/java-compat-rs"
homepage = "https://oxidestack.github.io/java-compat-rs/"
documentation = "https://docs.rs/java-compat-rs"
readme = "README.md"
keywords = ["java", "jdk", "compatibility", "formatting", "regex"]
categories = ["text-processing", "internationalization"]
# What crates.io gets: the library, its licence and notice, the README and the changelog. The pinned
# upstream sources, the tests and their recorded vectors, the tools, the docs and the site stay in the
# repository.
include = ["/src/**", "/LICENSE", "/NOTICE", "/README.md", "/CHANGELOG.md"]

[lib]
name = "java_compat"

[package.metadata.port]
upstream = "OpenJDK"
upstream-versions = ["21", "26"]

[dependencies]
chrono = { version = "0.4", default-features = false }
chrono-tz = { version = "0.10", default-features = false }
fancy-regex = "0.19.2"
num-bigint = "0.4"
num-traits = "0.2"
parking_lot = "0.12.5"

[dev-dependencies]
serde_json = "1.0.151"
